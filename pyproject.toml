[project]
name = "patient-document-studio"
version = "0.1.0"
description = "Local-first clinical document generator with replaceable template sources"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "reportlab>=4.2,<5",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9", "pypdf>=5,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["app"]
